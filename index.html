<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image to Dot Art Converter</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #222;
            color: #fff;
            padding: 20px;
            max-width: 800px;
            margin: 0 auto;
        }
        .controls {
            margin-bottom: 20px;
            display: flex;
            gap: 15px;
            align-items: center;
        }
        /* Crucial: The output container must use a monospaced font and preserve spaces */
        #output {
            font-family: "Courier New", Courier, monospace;
            font-size: 10px;
            line-height: 10px;
            letter-spacing: 0px;
            white-space: pre;
            background-color: #111;
            color: #fff;
            padding: 20px;
            overflow-x: auto;
            border-radius: 5px;
            border: 1px solid #444;
        }
        label { font-weight: bold; }
    </style>
</head>
<body>

    <h2>Image to Dot Art Generator</h2>
    
    <div class="controls">
        <input type="file" id="imageLoader" accept="image/*">
        
        <label for="widthInput">Target Width (chars):</label>
        <input type="number" id="widthInput" value="80" min="20" max="200" style="width: 60px;">

        <label for="thresholdInput">Threshold:</label>
        <input type="range" id="thresholdInput" min="0" max="255" value="128">
    </div>

    <pre id="output">Upload an image to see the dot art...</pre>

    <canvas id="canvas" style="display:none;"></canvas>

    <script>
        const imageLoader = document.getElementById('imageLoader');
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const output = document.getElementById('output');
        const widthInput = document.getElementById('widthInput');
        const thresholdInput = document.getElementById('thresholdInput');
        
        let currentImage = null;

        imageLoader.addEventListener('change', handleImage, false);
        thresholdInput.addEventListener('input', () => { if(currentImage) generateDotArt(); });
        widthInput.addEventListener('change', () => { if(currentImage) generateDotArt(); });

        function handleImage(e) {
            const reader = new FileReader();
            reader.onload = function(event) {
                currentImage = new Image();
                currentImage.onload = function() {
                    generateDotArt();
                }
                currentImage.src = event.target.result;
            }
            reader.readAsDataURL(e.target.files[0]);
        }

        function generateDotArt() {
            if (!currentImage) return;

            const targetWidthChars = parseInt(widthInput.value);
            // Each braille character is 2 pixels wide and 4 pixels high
            const targetPixelWidth = targetWidthChars * 2; 
            const scale = targetPixelWidth / currentImage.width;
            const targetPixelHeight = Math.round(currentImage.height * scale);
            
            // Adjust height to be a multiple of 4
            canvas.width = targetPixelWidth;
            canvas.height = targetPixelHeight + (4 - (targetPixelHeight % 4));

            // Clear and draw resized image
            ctx.fillStyle = "#FFFFFF";
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.drawImage(currentImage, 0, 0, canvas.width, canvas.height);

            const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            const pixels = imgData.data;
            const threshold = parseInt(thresholdInput.value);

            // Binary array: true if dark pixel, false if light pixel
            const binaryGrid = [];
            for (let y = 0; y < canvas.height; y++) {
                binaryGrid[y] = [];
                for (let x = 0; x < canvas.width; x++) {
                    const idx = (y * canvas.width + x) * 4;
                    const r = pixels[idx];
                    const g = pixels[idx + 1];
                    const b = pixels[idx + 2];
                    
                    // Standard luminance formula for grayscale conversion
                    const gray = 0.2126 * r + 0.7152 * g + 0.0722 * b;
                    
                    // If pixel is darker than threshold, consider it a "dot" (invert logic if your background is white)
                    binaryGrid[y][x] = gray < threshold; 
                }
            }

            // Loop through the binary grid in 2x4 blocks to construct Braille letters
            let resultText = "";
            
            // Mapping order for standard unicode braille dot patterns:
            // [1] [4]
            // [2] [5]
            // [3] [6]
            // [7] [8]
            const dotOffsets = [
                [0,0], [1,0], [2,0],
                [0,1], [1,1], [2,1],
                [3,0], [3,1]
            ];

            for (let y = 0; y < canvas.height; y += 4) {
                let rowText = "";
                for (let x = 0; x < canvas.width; x += 2) {
                    let brailleCodeOffset = 0;
                    
                    // Check all 8 sub-pixels in the 2x4 cell
                    for (let i = 0; i < 8; i++) {
                        const dy = dotOffsets[i][0];
                        const dx = dotOffsets[i][1];
                        
                        if (binaryGrid[y + dy] && binaryGrid[y + dy][x + dx]) {
                            brailleCodeOffset |= (1 << i);
                        }
                    }
                    
                    // \u2800 is the blank braille character. Add the offset to get the specific dot layout
                    rowText += String.fromCharCode(0x2800 + brailleCodeOffset);
                }
                resultText += rowText + "\n";
            }

            output.textContent = resultText;
        }
    </script>
</body>
</html>
