<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dot Art Engine</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Oswald:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        /* --- CHAMELEON THEME VARIABLES --- */
        :root {
            --bg-color: #ffffff;
            --text-color: #000000;
            --border-color: #000000;
            --accent-color: #cc3333;
            --accent-hover: #b32d2d;
            --card-bg: #ffffff;
            --output-bg: #000000;
            --output-text: #ffffff;
            --label-color: #888888;
        }

        [data-theme="dark"] {
            --bg-color: #121212;
            --text-color: #ffffff;
            --border-color: #aaaaaa;
            --accent-color: #D32F2F;
            --accent-hover: #B71C1C;
            --card-bg: #1e1e1e;
            --output-bg: #000000;
            --output-text: #00ff00; /* Fun hacker green for dark mode! */
            --label-color: #aaaaaa;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Oswald', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        .container {
            width: 100%;
            max-width: 1000px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .card-block {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 24px;
            text-align: center;
            border-radius: 0px;
            transition: background-color 0.3s ease, border-color 0.3s ease;
        }

        .upload-zone {
            cursor: pointer;
            font-size: 24px; 
            font-weight: 500;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }
        .upload-zone input { display: none; }

        .controls-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 24px;
            text-align: left;
        }

        @media (max-width: 600px) {
            .controls-grid { grid-template-columns: 1fr; }
        }

        .control-item {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .control-item label {
            font-size: 18px; 
            font-weight: 500;
            text-transform: uppercase;
            color: var(--text-color);
            letter-spacing: 0.5px;
        }

        input[type="range"] {
            width: 100%;
            accent-color: var(--accent-color); 
            cursor: pointer;
        }

        .checkbox-label {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 18px; 
            cursor: pointer;
            font-weight: 500;
            text-transform: uppercase;
            margin-top: 15px;
        }

        .checkbox-label input {
            accent-color: var(--accent-color);
            width: 18px;
            height: 18px;
        }

        .btn-go {
            font-family: 'Oswald', sans-serif;
            background-color: var(--accent-color); 
            color: #ffffff; /* Always white text on red */
            border: none;
            padding: 16px;
            font-size: 24px; 
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            width: 100%;
            transition: background-color 0.2s;
        }

        .btn-go:hover {
            background-color: var(--accent-hover);
        }

        .btn-secondary {
            font-family: 'Oswald', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            border: 1px solid var(--border-color);
            padding: 12px;
            font-size: 18px; 
            font-weight: 500;
            text-transform: uppercase;
            cursor: pointer;
            width: 100%;
            margin-top: 10px;
            letter-spacing: 0.5px;
            transition: all 0.3s ease;
        }
        .btn-secondary:hover {
            background-color: var(--card-bg);
            opacity: 0.8;
        }

        .output-block {
            border: 1px solid var(--border-color);
            background-color: var(--output-bg); 
            color: var(--output-text);
            text-align: left;
            padding: 24px;
            overflow: auto;
            transition: all 0.3s ease;
        }

        #output {
            font-family: 'JetBrains Mono', monospace; 
            font-size: 11px;
            line-height: 11px;
            letter-spacing: 0px;
            white-space: pre;
            min-height: 250px;
            max-height: 500px;
        }
        
        .matrix-info {
            font-family: 'Oswald', sans-serif;
            font-size: 18px; 
            color: var(--label-color);
            margin-bottom: 12px;
            display: block;
            text-transform: uppercase;
        }
    </style>
</head>
<body>

<div class="container">

    <div class="card-block upload-zone" onclick="document.getElementById('imageLoader').click()">
        <span id="uploadLabel">UPLOAD YOUR IMAGE FILE</span>
        <input type="file" id="imageLoader" accept="image/*">
    </div>

    <div class="card-block">
        <div class="controls-grid">
            <div class="control-item">
                <label id="widthLabel">Width: 60 Chars</label>
                <input type="range" id="widthInput" value="60" min="30" max="120" step="1">
            </div>
            <div class="control-item">
                <label id="thresholdLabel">Contrast Threshold: 104</label>
                <input type="range" id="thresholdInput" min="0" max="255" value="104">
            </div>
        </div>
        
        <label class="checkbox-label">
            <input type="checkbox" id="invertInput" checked>
            Invert Pixels (Dark/Light mode)
        </label>
    </div>
    
    <button class="btn-go" id="copyBtn">Copy Dot Art</button>
    <button class="btn-secondary" id="downloadBtn">Download .txt File</button>

    <div class="output-block">
        <span class="matrix-info" id="dimensionsLabel">0 x 0 matrix</span>
        <pre id="output">Waiting for file ingestion...</pre>
    </div>

</div>

<canvas id="canvas" style="display:none;"></canvas>

<script>
    // --- THE URL THEME READER (Added for Iframe Sync) ---
    const urlParams = new URLSearchParams(window.location.search);
    const urlTheme = urlParams.get('theme') || 'dark'; // Defaults to dark mode
    document.documentElement.setAttribute('data-theme', urlTheme);

    // --- YOUR ORIGINAL ENGINE LOGIC ---
    const imageLoader = document.getElementById('imageLoader');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const output = document.getElementById('output');
    const widthInput = document.getElementById('widthInput');
    const thresholdInput = document.getElementById('thresholdInput');
    const invertInput = document.getElementById('invertInput');
    
    const widthLabel = document.getElementById('widthLabel');
    const thresholdLabel = document.getElementById('thresholdLabel');
    const dimensionsLabel = document.getElementById('dimensionsLabel');
    const uploadLabel = document.getElementById('uploadLabel');
    
    const copyBtn = document.getElementById('copyBtn');
    const downloadBtn = document.getElementById('downloadBtn');

    let currentImage = null;

    imageLoader.addEventListener('change', handleImage, false);
    thresholdInput.addEventListener('input', () => { 
        thresholdLabel.textContent = `Contrast Threshold: ${thresholdInput.value}`;
        if(currentImage) generateDotArt(); 
    });
    widthInput.addEventListener('input', () => { 
        widthLabel.textContent = `Width: ${widthInput.value} Chars`;
        if(currentImage) generateDotArt(); 
    });
    invertInput.addEventListener('change', () => { if(currentImage) generateDotArt(); });

    copyBtn.addEventListener('click', () => {
        if(!currentImage) return;
        navigator.clipboard.writeText(output.textContent);
        const originalText = copyBtn.textContent;
        copyBtn.textContent = "Copied to Clipboard!";
        setTimeout(() => copyBtn.textContent = originalText, 2000);
    });

    downloadBtn.addEventListener('click', () => {
        if(!currentImage) return;
        const blob = new Blob([output.textContent], { type: 'text/plain' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `dotart-${Date.now()}.txt`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
    });

    function handleImage(e) {
        if(!e.target.files.length) return;
        uploadLabel.textContent = e.target.files[0].name.toUpperCase();
        const reader = new FileReader();
        reader.onload = function(event) {
            currentImage = new Image();
            currentImage.onload = function() {
                generateDotArt();
            }
            currentImage.src = event.target.result;
        }
        reader.readAsDataURL(e.target.files[0]);
    }

    function generateDotArt() {
        if (!currentImage) return;

        const targetWidthChars = parseInt(widthInput.value);
        const targetPixelWidth = targetWidthChars * 2; 
        
        // Calculate the height scale factor
        const scale = targetPixelWidth / currentImage.width;
        
        // Added aspect-ratio multiplier (0.75) to pre-flatten the image height
        const targetPixelHeight = Math.round((currentImage.height * scale) * 0.75);
        
        canvas.width = targetPixelWidth;
        canvas.height = targetPixelHeight + (4 - (targetPixelHeight % 4));

        ctx.fillStyle = "#FFFFFF";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.drawImage(currentImage, 0, 0, canvas.width, canvas.height);

        const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
        const pixels = imgData.data;
        const threshold = parseInt(thresholdInput.value);
        const isInverted = invertInput.checked;

        const binaryGrid = [];
        for (let y = 0; y < canvas.height; y++) {
            binaryGrid[y] = [];
            for (let x = 0; x < canvas.width; x++) {
                const idx = (y * canvas.width + x) * 4;
                const gray = 0.2126 * pixels[idx] + 0.7152 * pixels[idx+1] + 0.0722 * pixels[idx+2];
                binaryGrid[y][x] = isInverted ? (gray > threshold) : (gray < threshold); 
            }
        }

        let resultText = "";
        const dotOffsets = [[0,0], [1,0], [2,0], [0,1], [1,1], [2,1], [3,0], [3,1]];

        for (let y = 0; y < canvas.height; y += 4) {
            let rowText = "";
            for (let x = 0; x < canvas.width; x += 2) {
                let offset = 0;
                for (let i = 0; i < 8; i++) {
                    const dy = dotOffsets[i][0];
                    const dx = dotOffsets[i][1];
                    if (binaryGrid[y + dy] && binaryGrid[y + dy][x + dx]) {
                        offset |= (1 << i);
                    }
                }
                rowText += String.fromCharCode(0x2800 + offset);
            }
            resultText += rowText + "\n";
        }

        output.textContent = resultText;
        dimensionsLabel.textContent = `${targetWidthChars} x ${canvas.height / 4} comment block`;
    }
</script>
</body>
</html>
