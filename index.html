<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>COFFEEUNDERFLOW // Dot Art Engine</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Urbanist:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0b111e;
            --surface-color: #00205D; /* Signature IES/CoffeeUnderflow Midnight Blue */
            --border-color: rgba(222, 255, 154, 0.2);
            --text-main: #F5F5F5;
            --text-muted: #daffde;
            --accent-color: #DEFF9A; /* Lime Accent */
            --accent-hover: #c5eb7b;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Urbanist', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            padding: 60px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 1100px;
            display: flex;
            flex-direction: column;
            gap: 30px;
        }

        header {
            border-left: 8px solid var(--accent-color);
            padding-left: 25px;
            margin-bottom: 10px;
        }

        header h1 {
            font-size: 36px;
            font-weight: 700;
            letter-spacing: -1px;
            text-transform: uppercase;
        }

        header h1 span { color: var(--accent-color); }

        header p {
            font-size: 16px;
            color: var(--text-muted);
            margin-top: 6px;
            opacity: 0.8;
        }

        .workspace {
            display: grid;
            grid-template-columns: 320px 1fr;
            gap: 30px;
        }

        @media (max-width: 768px) {
            .workspace { grid-template-columns: 1fr; }
        }

        .panel {
            background-color: var(--surface-color);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 30px;
            display: flex;
            flex-direction: column;
            gap: 24px;
            height: fit-content;
            box-shadow: 0 15px 30px rgba(0,0,0,0.2);
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .control-group label {
            font-size: 13px;
            font-weight: 700;
            color: var(--accent-color);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .file-upload {
            border: 2px dashed var(--border-color);
            padding: 24px;
            text-align: center;
            border-radius: 8px;
            cursor: pointer;
            transition: border-color 0.2s;
            background: rgba(0,0,0,0.1);
        }

        .file-upload:hover { border-color: var(--accent-color); }
        .file-upload input { display: none; }

        input[type="range"] {
            width: 100%;
            accent-color: var(--accent-color);
            cursor: pointer;
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
            font-size: 15px;
            font-weight: 500;
        }

        .checkbox-group input {
            accent-color: var(--accent-color);
            width: 18px;
            height: 18px;
        }

        .btn {
            background-color: var(--accent-color);
            color: #00205D;
            border: none;
            padding: 14px;
            border-radius: 8px;
            font-weight: 700;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.2s;
            width: 100%;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .btn:hover { 
            background-color: var(--accent-hover);
            transform: translateY(-1px);
        }
        
        .btn-secondary {
            background-color: transparent;
            color: var(--text-main);
            border: 1px solid var(--border-color);
            margin-top: 10px;
        }
        .btn-secondary:hover { 
            background-color: rgba(255,255,255,0.05);
            border-color: var(--accent-color);
        }

        .output-container {
            display: flex;
            flex-direction: column;
            background-color: #000000;
            border: 1px solid var(--border-color);
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 15px 30px rgba(0,0,0,0.3);
        }

        .output-header {
            background-color: rgba(0, 32, 93, 0.4);
            padding: 16px 24px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .output-header span {
            font-size: 13px;
            font-family: 'JetBrains Mono', monospace;
            color: var(--text-muted);
            font-weight: 500;
        }

        #output {
            font-family: 'JetBrains Mono', monospace;
            font-size: 8px;
            line-height: 8px;
            letter-spacing: 0px;
            white-space: pre;
            padding: 30px;
            overflow: auto;
            min-height: 450px;
            max-height: 700px;
            color: #ffffff;
            background-color: #000000;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>COFFEE<span>UNDERFLOW</span> // DOT ART ENGINE</h1>
        <p>Stateless optimization pipeline translating local binary images into crisp Unicode Braille matrices.</p>
    </header>

    <div class="workspace">
        <div class="panel">
            <div class="control-group">
                <label>Source Media</label>
                <div class="file-upload" onclick="document.getElementById('imageLoader').click()">
                    <span id="uploadLabel">Upload Image Binaries</span>
                    <input type="file" id="imageLoader" accept="image/*">
                </div>
            </div>

            <div class="control-group">
                <label id="widthLabel">Width: 105 Chars</label>
                <input type="range" id="widthInput" value="105" min="40" max="200" step="1">
            </div>

            <div class="control-group">
                <label id="thresholdLabel">Contrast Threshold: 104</label>
                <input type="range" id="thresholdInput" min="0" max="255" value="104">
            </div>

            <div class="control-group">
                <label class="checkbox-group">
                    <input type="checkbox" id="invertInput" checked>
                    Invert Pixels (Dark/Light mode)
                </label>
            </div>
            
            <div style="margin-top: auto; padding-top: 20px; border-top: 1px solid rgba(255,255,255,0.1);">
                <button class="btn" id="copyBtn">Copy Dot Art</button>
                <button class="btn btn-secondary" id="downloadBtn">Download .txt</button>
            </div>
        </div>

        <div class="output-container">
            <div class="output-header">
                <span>RENDERED_MATRIX.TXT</span>
                <span id="dimensionsLabel">0 x 0 matrix</span>
            </div>
            <pre id="output">System streaming standby. Ready for execution ingestion loop...</pre>
        </div>
    </div>
</div>

<canvas id="canvas" style="display:none;"></canvas>

<script>
    const imageLoader = document.getElementById('imageLoader');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const output = document.getElementById('output');
    const widthInput = document.getElementById('widthInput');
    const thresholdInput = document.getElementById('thresholdInput');
    const invertInput = document.getElementById('invertInput');
    
    const widthLabel = document.getElementById('widthLabel');
    const thresholdLabel = document.getElementById('thresholdLabel');
    const dimensionsLabel = document.getElementById('dimensionsLabel');
    const uploadLabel = document.getElementById('uploadLabel');
    
    const copyBtn = document.getElementById('copyBtn');
    const downloadBtn = document.getElementById('downloadBtn');

    let currentImage = null;

    imageLoader.addEventListener('change', handleImage, false);
    thresholdInput.addEventListener('input', () => { 
        thresholdLabel.textContent = `Contrast Threshold: ${thresholdInput.value}`;
        if(currentImage) generateDotArt(); 
    });
    widthInput.addEventListener('input', () => { 
        widthLabel.textContent = `Width: ${widthInput.value} Chars`;
        if(currentImage) generateDotArt(); 
    });
    invertInput.addEventListener('change', () => { if(currentImage) generateDotArt(); });

    copyBtn.addEventListener('click', () => {
        if(!currentImage) return;
        navigator.clipboard.writeText(output.textContent);
        const originalText = copyBtn.textContent;
        copyBtn.textContent = "Copied to Clipboard!";
        setTimeout(() => copyBtn.textContent = originalText, 2000);
    });

    downloadBtn.addEventListener('click', () => {
        if(!currentImage) return;
        const blob = new Blob([output.textContent], { type: 'text/plain' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `coffeeunderflow-dotart-${Date.now()}.txt`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
    });

    function handleImage(e) {
        if(!e.target.files.length) return;
        uploadLabel.textContent = e.target.files[0].name;
        const reader = new FileReader();
        reader.onload = function(event) {
            currentImage = new Image();
            currentImage.onload = function() {
                generateDotArt();
            }
            currentImage.src = event.target.result;
        }
        reader.readAsDataURL(e.target.files[0]);
    }

    function generateDotArt() {
        if (!currentImage) return;

        const targetWidthChars = parseInt(widthInput.value);
        const targetPixelWidth = targetWidthChars * 2; 
        const scale = targetPixelWidth / currentImage.width;
        const targetPixelHeight = Math.round(currentImage.height * scale);
        
        canvas.width = targetPixelWidth;
        canvas.height = targetPixelHeight + (4 - (targetPixelHeight % 4));

        ctx.fillStyle = "#FFFFFF";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.drawImage(currentImage, 0, 0, canvas.width, canvas.height);

        const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
        const pixels = imgData.data;
        const threshold = parseInt(thresholdInput.value);
        const isInverted = invertInput.checked;

        const binaryGrid = [];
        for (let y = 0; y < canvas.height; y++) {
            binaryGrid[y] = [];
            for (let x = 0; x < canvas.width; x++) {
                const idx = (y * canvas.width + x) * 4;
                const gray = 0.2126 * pixels[idx] + 0.7152 * pixels[idx+1] + 0.0722 * pixels[idx+2];
                binaryGrid[y][x] = isInverted ? (gray > threshold) : (gray < threshold); 
            }
        }

        let resultText = "";
        const dotOffsets = [[0,0], [1,0], [2,0], [0,1], [1,1], [2,1], [3,0], [3,1]];

        for (let y = 0; y < canvas.height; y += 4) {
            let rowText = "";
            for (let x = 0; x < canvas.width; x += 2) {
                let offset = 0;
                for (let i = 0; i < 8; i++) {
                    const dy = dotOffsets[i][0];
                    const dx = dotOffsets[i][1];
                    if (binaryGrid[y + dy] && binaryGrid[y + dy][x + dx]) {
                        offset |= (1 << i);
                    }
                }
                rowText += String.fromCharCode(0x2800 + offset);
            }
            resultText += rowText + "\n";
        }

        output.textContent = resultText;
        dimensionsLabel.textContent = `${targetWidthChars} x ${canvas.height / 4} characters`;
    }
</script>
</body>
</html>
