<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dot Art Engine</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

    <div class="card-block upload-zone" id="upload-zone">
        <span id="uploadLabel">Upload Your Image File</span>
        <input type="file" id="imageLoader" accept="image/*">
    </div>

    <div class="output-block">
        <span class="matrix-info" id="dimensionsLabel">0 x 0 matrix</span>
        <pre id="output">Waiting for file ingestion...</pre>
    </div>

    <div class="card-block">
        <div class="controls-grid">
            <div class="control-item">
                <label id="widthLabel">Width: 60 Chars</label>
                <input type="range" id="widthInput" value="60" min="30" max="120" step="1">
            </div>
            <div class="control-item">
                <label id="thresholdLabel">Contrast Threshold: 104</label>
                <input type="range" id="thresholdInput" min="0" max="255" value="104">
            </div>
        </div>
        
        <label class="checkbox-label">
            <input type="checkbox" id="invertInput" checked>
            Invert Pixels (Dark/Light mode)
        </label>
    </div>
    
    <div class="button-group">
        <button class="btn-go" id="copyBtn">Copy Dot Art</button>
        <button class="btn-secondary" id="downloadBtn">Download .txt File</button>
    </div>

</div>

<canvas id="canvas" style="display:none;"></canvas>

<script src="main.js"></script>
</body>
</html>
